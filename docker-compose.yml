services:
  node1:
    image: bidzhao/storefs:0.5.0
    container_name: storefs-node1
    restart: unless-stopped
    networks:
      - storefs-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "7946:7946"
      - "8901:8901"
      - "2049:2049"
      - "4445:4445"
    volumes:
      - /:/hostfs:ro
      - ./configs/config1.yaml:/app/config.yaml
      - ./data/node1/disk1:/disk1
      - ./data/node1/disk2:/disk2
    environment:
      - TZ=Asia/Shanghai
    depends_on:
      init-db:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7946/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  node2:
    image: bidzhao/storefs:0.5.0
    container_name: storefs-node2
    restart: unless-stopped
    networks:
      - storefs-net
    ports:
      - "7947:7946"
      - "8902:8901"
    volumes:
      - /:/hostfs:ro
      - ./configs/config2.yaml:/app/config.yaml
      - ./data/node2/disk1:/disk1
      - ./data/node2/disk2:/disk2
    environment:
      - TZ=Asia/Shanghai
    depends_on:
      init-db:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7946/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  node3:
    image: bidzhao/storefs:0.5.0
    container_name: storefs-node3
    restart: unless-stopped
    networks:
      - storefs-net
    ports:
      - "7948:7946"
      - "8903:8901"
    volumes:
      - /:/hostfs:ro
      - ./configs/config3.yaml:/app/config.yaml
      - ./data/node3/disk1:/disk1
      - ./data/node3/disk2:/disk2
    environment:
      - TZ=Asia/Shanghai
    depends_on:
      init-db:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7946/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  doris-fe:
    image: apache/doris:fe-4.1.3
    container_name: doris-fe
    hostname: doris-fe
    restart: unless-stopped

    ports:
      - "8030:8030"
      - "9030:9030"
      - "9010:9010"

    volumes:
      - doris-fe-meta:/opt/apache-doris/fe/doris-meta
      - doris-fe-log:/opt/apache-doris/fe/log

    environment:
      TZ: Asia/Shanghai
      FE_SERVERS: "fe1:172.30.0.10:9010"
      FE_ID: "1"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysql -h 127.0.0.1 -P 9030 -uroot -e 'SHOW FRONTENDS;' >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

    networks:
      storefs-net:
        ipv4_address: 172.30.0.10

  doris-be:
    image: apache/doris:be-4.1.3
    container_name: doris-be
    hostname: doris-be
    restart: unless-stopped

    ports:
      - "8040:8040"
      - "9050:9050"
      - "9060:9060"

    volumes:
      - doris-be-storage:/opt/apache-doris/be/storage
      - doris-be-log:/opt/apache-doris/be/log

    environment:
      TZ: Asia/Shanghai
      FE_SERVERS: "fe1:172.30.0.10:9010"
      BE_ADDR: "172.30.0.20:9050"

    depends_on:
      doris-fe:
        condition: service_healthy

    networks:
      storefs-net:
        ipv4_address: 172.30.0.20

  init-db:
    image: alpine/mysql:15.2
    container_name: doris-init

    networks:
      - storefs-net
    
    depends_on:
      doris-fe:
        condition: service_healthy
      doris-be:
        condition: service_started

    volumes:
      - ./configs/init.sql:/init.sql
      - ./configs/catalog.sql:/catalog.sql
      - ./configs/db-init:/init-done

    environment:
      TZ: Asia/Shanghai

    entrypoint: ["/bin/sh", "-c"]

    command:
      - |
        set -e

        echo "Waiting for Doris FE..."

        until /usr/bin/mariadb \
            -h doris-fe \
            -P 9030 \
            -uroot \
            -N \
            -e "SELECT 1" >/dev/null 2>&1
        do
            sleep 2
        done
        
        echo "FE query service is ready."
        
        echo "Waiting for Doris BE..."
        
        until /usr/bin/mariadb \
            -h doris-fe \
            -P 9030 \
            -uroot \
            -N \
            -e "
                SELECT COUNT(*)
                FROM backends()
                WHERE Alive = 'true'
                  AND SystemDecommissioned = 'false';
            " 2>/dev/null | grep -q '^1$'
        do
            sleep 2
        done
        
        echo "BE is registered and alive."
        
        echo "Waiting for Doris SQL read/write..."

        until /usr/bin/mariadb -h doris-fe -P 9030 -uroot -N -B -e "SELECT 1" 2>/dev/null; do
            echo "Doris SQL is not ready, retrying..."
            sleep 2
        done
        
        echo "Doris SQL is ready."

        echo "Running init.sql..."
        /usr/bin/mariadb -h doris-fe -P9030 -uroot < /init.sql
        echo "Running catalog.sql..."
        /usr/bin/mariadb -h doris-fe -P9030 -uroot < /catalog.sql

        echo "Marking init done..."
        touch /init-done/.done
  
        echo "Init completed."

networks:
  storefs-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  doris-fe-meta:
  doris-fe-log:
  doris-be-storage:
  doris-be-log: