services:
  node1:
    image: bidzhao/storefs:0.6.0
    container_name: storefs-node1
    restart: unless-stopped
    networks:
      - storefs-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "7946:7946"
      - "8901:8901"
      - "2049:2049"
      - "4445:4445"
    volumes:
      - /:/hostfs:ro
      - ./configs/config1.yaml:/app/config.yaml
      - ./data/node1/disk1:/disk1
      - ./data/node1/disk2:/disk2
    environment:
      - TZ=Asia/Shanghai
    depends_on:
      init-db:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7946/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  node2:
    image: bidzhao/storefs:0.6.0
    container_name: storefs-node2
    restart: unless-stopped
    networks:
      - storefs-net
    ports:
      - "7947:7946"
      - "8902:8901"
    volumes:
      - /:/hostfs:ro
      - ./configs/config2.yaml:/app/config.yaml
      - ./data/node2/disk1:/disk1
      - ./data/node2/disk2:/disk2
    environment:
      - TZ=Asia/Shanghai
    depends_on:
      init-db:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7946/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  node3:
    image: bidzhao/storefs:0.6.0
    container_name: storefs-node3
    restart: unless-stopped
    networks:
      - storefs-net
    ports:
      - "7948:7946"
      - "8903:8901"
    volumes:
      - /:/hostfs:ro
      - ./configs/config3.yaml:/app/config.yaml
      - ./data/node3/disk1:/disk1
      - ./data/node3/disk2:/disk2
    environment:
      - TZ=Asia/Shanghai
    depends_on:
      init-db:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7946/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  tidb:
    image: pingcap/tidb:v8.5.8
    container_name: tidb
    hostname: tidb
    ports:
      - "14000:4000"
      - "10080:10080"
    restart: unless-stopped
    networks:
      - storefs-net
    environment:
      TZ: Asia/Shanghai

  init-db:
    image: alpine/mysql:15.2
    container_name: tidb-init

    networks:
      - storefs-net
    
    depends_on:
      tidb:
        condition: service_started

    volumes:
      - ./configs/init.sql:/init.sql
      - ./configs/catalog.sql:/catalog.sql
      - ./configs/iceberg.sql:/iceberg.sql
      - ./configs/db-init:/init-done

    environment:
      TZ: Asia/Shanghai

    entrypoint: ["/bin/sh", "-c"]

    command:
      - |
        set -e

        echo "Waiting for TiDB..."

        until /usr/bin/mariadb \
            -h tidb \
            -P 4000 \
            -uroot \
            -N \
            -e "SELECT 1" >/dev/null 2>&1
        do
            sleep 2
        done
        
        echo "TiDB service is ready."
        
        echo "Waiting for TiDB SQL read/write..."

        until /usr/bin/mariadb -h tidb -P 4000 -uroot -N -B -e "SELECT 1" 2>/dev/null; do
            echo "TiDB SQL is not ready, retrying..."
            sleep 2
        done
        
        echo "TiDB SQL is ready."

        if [ -f /init-done/.done ]; then
            echo "DB already initialized, skipping..."
            exit 0
        fi

        echo "Running init.sql..."
        /usr/bin/mariadb -h tidb -P4000 -uroot < /init.sql
        echo "Running catalog.sql..."
        /usr/bin/mariadb -h tidb -P4000 -uroot < /catalog.sql
        echo "Running iceberg.sql..."
        /usr/bin/mariadb -h tidb -P4000 -uroot < /iceberg.sql

        echo "Marking init done..."
        touch /init-done/.done
  
        echo "Init completed."

networks:
  storefs-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

